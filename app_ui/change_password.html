<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<meta name="description" content="Personal AI 账号密码修改">
<title>修改密码 · Personal AI</title>
<!-- 内联 SVG 图标：与 login.html 同做法，不新增文件、不新增后端路由。 -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Cdefs%3E%3ClinearGradient%20id='g'%20x1='0'%20y1='0'%20x2='1'%20y2='1'%3E%3Cstop%20offset='0'%20stop-color='%233B82F6'/%3E%3Cstop%20offset='1'%20stop-color='%236D5BF6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect%20width='32'%20height='32'%20rx='8'%20fill='url%28%23g%29'/%3E%3Cpath%20d='M16%206.4l2.75%207.85L26.6%2017l-7.85%202.75L16%2027.6l-2.75-7.85L5.4%2017l7.85-2.75z'%20fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/auth/static/style.css">
</head>
<body>

<svg class="sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" style="position:absolute;width:0;height:0;overflow:hidden">
<symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8.2" r="3.8"/><path d="M4.6 20.5a7.4 7.4 0 0 1 14.8 0"/></symbol>
<symbol id="i-lock" viewBox="0 0 24 24"><rect x="4.6" y="10.4" width="14.8" height="10" rx="2.4"/><path d="M8.2 10.4V7.8a3.8 3.8 0 0 1 7.6 0v2.6"/></symbol>
<symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3.2l7 2.6v5.5c0 4.3-2.9 7.6-7 9.5-4.1-1.9-7-5.2-7-9.5V5.8z"/><path d="M9.1 12.1l2 2 3.8-3.9"/></symbol>
<symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5.5"/><path d="M12 7.8h.01"/></symbol>
<symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3.6l8.6 15.2H3.4z"/><path d="M12 9.6v4.2"/><path d="M12 16.8h.01"/></symbol>
</svg>

<a class="skip" href="#main">跳到主内容</a>

<div class="bg" aria-hidden="true">
    <span class="bg__glow bg__glow--blue"></span>
    <span class="bg__glow bg__glow--violet"></span>
    <span class="bg__glow bg__glow--cyan"></span>
    <span class="bg__grid"></span>
</div>

<main class="shell" id="main">

    <!-- ================= 左栏：品牌（与登录页同一版式） ================= -->
    <section class="pitch" aria-labelledby="pitch-title">
        <span class="brand">
            <span class="brand__mark" aria-hidden="true">
                <svg viewBox="0 0 32 32"><path d="M16 4.5l2.9 8.2 8.2 2.9-8.2 2.9L16 26.7l-2.9-8.2L5 15.6l8.1-2.9z" fill="#fff"/></svg>
            </span>
            <span class="brand__text">
                <strong>Personal AI</strong>
                <small>智能工作平台</small>
            </span>
        </span>

        <h1 id="pitch-title">账号安全<br><em>从一次改密开始</em></h1>
        <p class="pitch__desc">
            修改成功后，当前会话继续有效，其他设备的会话将被撤销；
            新密码至少 10 位。
        </p>

        <p class="pitch__meta"><span class="dot" aria-hidden="true"></span>本地副本 · 会话由服务端管理</p>
    </section>

    <!-- ================= 右栏：改密卡片 ================= -->
    <section class="panel" aria-labelledby="cp-title">

        <header class="panel__head">
            <h2 id="cp-title">修改密码</h2>
            <p id="cp-subtitle">正在读取账号状态…</p>
        </header>

        <!-- 模式提示：强制改密 / 自愿改密 -->
        <div class="status" id="cp-mode" data-tone="warn" role="status" aria-live="polite" hidden>
            <svg class="ico" aria-hidden="true"><use href="#i-info"/></svg>
            <div>
                <strong id="cp-mode-title"></strong>
                <span id="cp-mode-text"></span>
            </div>
        </div>

        <form class="form" id="cp-form" novalidate>

            <div class="field" id="field-current">
                <label for="cp-current">当前密码</label>
                <div class="field__box">
                    <svg class="field__ico" aria-hidden="true"><use href="#i-lock"/></svg>
                    <input
                        id="cp-current"
                        name="current_password"
                        type="password"
                        autocomplete="current-password"
                        placeholder="请输入当前密码"
                        required
                        maxlength="128"
                        aria-describedby="cp-current-err"
                        aria-invalid="false">
                </div>
                <p class="field__err" id="cp-current-err" hidden></p>
            </div>

            <div class="field" id="field-new">
                <label for="cp-new">新密码</label>
                <div class="field__box">
                    <svg class="field__ico" aria-hidden="true"><use href="#i-shield"/></svg>
                    <input
                        id="cp-new"
                        name="new_password"
                        type="password"
                        autocomplete="new-password"
                        placeholder="至少 10 位"
                        required
                        minlength="10"
                        maxlength="128"
                        aria-describedby="cp-new-err"
                        aria-invalid="false">
                </div>
                <p class="field__err" id="cp-new-err" hidden></p>
            </div>

            <div class="field" id="field-confirm">
                <label for="cp-confirm">确认新密码</label>
                <div class="field__box">
                    <svg class="field__ico" aria-hidden="true"><use href="#i-lock"/></svg>
                    <input
                        id="cp-confirm"
                        name="confirm_password"
                        type="password"
                        autocomplete="new-password"
                        placeholder="再次输入新密码"
                        required
                        minlength="10"
                        maxlength="128"
                        aria-describedby="cp-confirm-err"
                        aria-invalid="false">
                </div>
                <p class="field__err" id="cp-confirm-err" hidden></p>
            </div>

            <div class="status" id="cp-alert" data-tone="error" role="alert" hidden>
                <svg class="ico" aria-hidden="true"><use href="#i-alert"/></svg>
                <div>
                    <strong id="cp-alert-title">修改未完成</strong>
                    <span id="cp-alert-text"></span>
                </div>
            </div>

            <button class="btn btn--primary" type="submit" id="cp-submit">
                <span class="spinner" aria-hidden="true"></span>
                <span class="btn__label">确认修改</span>
            </button>
        </form>

        <p class="panel__foot">
            <a href="/workbench" id="cp-back" hidden>返回工作台</a>
            <a href="#" id="cp-logout">退出登录</a>
        </p>

        <div class="notice">
            <strong>安全说明</strong>
            <p>
                密码校验在服务端完成（Argon2id），本页只是表单。是否允许访问业务功能
                由服务端会话状态决定，改密成功前所有业务接口一律 403。
            </p>
        </div>

    </section>

</main>

<script src="/auth/static/change_password.js" defer></script>

</body>
</html>
